<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Cam & Studio Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .filter-none { filter: none; }
    .filter-warm { filter: sepia(0.35) saturate(1.4); }
    .filter-cool { filter: hue-rotate(180deg) saturate(1.1); }
    .filter-vintage { filter: contrast(1.1) brightness(0.9) sepia(0.5); }
    .filter-bw { filter: grayscale(1); }
    .filter-vibrant { filter: saturate(2) contrast(1.1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-camera"></i>
        </div>
        <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Studio Vault</span>
      </div>

      <!-- User Status / Auth Button -->
      <div id="authSection" class="flex items-center gap-3">
        <!-- Injected via JS -->
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Auth Wall (แสดงเมื่อยังไม่ล็อกอิน) -->
    <div id="loginPrompt" class="text-center py-16 bg-slate-900/40 rounded-3xl border border-slate-800 backdrop-blur max-w-md mx-auto shadow-2xl">
      <div class="w-16 h-16 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl border border-indigo-500/20">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 class="text-2xl font-bold mb-2">เข้าสู่ระบบเพื่อใช้งาน</h2>
      <p class="text-slate-400 text-sm mb-6 px-6">เพื่อความปลอดภัย รูปและวิดีโอทั้งหมดจะถูกเก็บเป็นความลับเฉพาะบัญชีคุณเท่านั้น</p>
      
      <div class="space-y-3 px-8">
        <input id="authEmail" type="email" placeholder="อีเมลของคุณ" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
        <input id="authPassword" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
        
        <div class="flex gap-2 pt-2">
          <button id="btnLogin" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-medium text-sm transition">เข้าสู่ระบบ</button>
          <button id="btnRegister" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 py-3 rounded-xl font-medium text-sm transition">สมัครใหม่</button>
        </div>
      </div>
    </div>

    <!-- App Studio (แสดงเมื่อล็อกอินแล้ว) -->
    <div id="studioApp" class="hidden space-y-10">
      
      <!-- Camera Viewport & Controls -->
      <section class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 shadow-2xl backdrop-blur">
        <div class="relative w-full max-w-2xl mx-auto rounded-2xl overflow-hidden bg-black aspect-[4/3] shadow-inner border border-slate-800/80">
          
          <video id="videoPreview" autoplay playsinline muted class="w-full h-full object-cover filter-none transition duration-200"></video>
          <canvas id="captureCanvas" class="hidden"></canvas>

          <!-- Recording Badge -->
          <div id="recordingBadge" class="hidden absolute top-4 left-4 bg-red-600/90 text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-2 animate-pulse backdrop-blur">
            <span class="w-2 h-2 rounded-full bg-white"></span>
            <span id="recordingTimer">00:00</span>
          </div>

          <!-- Countdown Display -->
          <div id="countdownBox" class="hidden absolute inset-0 bg-black/40 flex items-center justify-center text-7xl font-bold text-white drop-shadow-md">
            <span id="countdownNumber">3</span>
          </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="max-w-2xl mx-auto mt-6 flex flex-wrap items-center justify-between gap-4">
          <!-- Filters & Options -->
          <div class="flex items-center gap-2">
            <select id="filterSelect" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none">
              <option value="none">ปกติ (Normal)</option>
              <option value="warm">อบอุ่น (Warm)</option>
              <option value="cool">โทนเย็น (Cool)</option>
              <option value="vintage">วินเทจ (Vintage)</option>
              <option value="bw">ขาวดำ (B&W)</option>
              <option value="vibrant">สดใส (Vibrant)</option>
            </select>

            <select id="timerSelect" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none">
              <option value="0">ไม่ตั้งเวลา</option>
              <option value="3">ตั้งเวลา 3 วินาที</option>
              <option value="5">ตั้งเวลา 5 วินาที</option>
            </select>

            <button id="btnFlipCamera" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition" title="สลับกล้อง">
              <i class="fa-solid fa-camera-rotate"></i>
            </button>
          </div>

          <!-- Shutter Buttons -->
          <div class="flex items-center gap-3">
            <button id="btnCapturePhoto" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/30">
              <i class="fa-solid fa-camera"></i> ถ่ายรูป
            </button>
            <button id="btnToggleRecord" class="flex items-center gap-2 bg-red-600 hover:bg-red-500 px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-red-600/30">
              <i class="fa-solid fa-video"></i> <span id="recordBtnLabel">อัดวิดีโอ</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Vault Gallery Section (คลังย้อนหลัง) -->
      <section class="space-y-6">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
          <div class="flex items-center gap-4">
            <button id="tabMyVault" class="font-semibold text-lg pb-1 border-b-2 border-indigo-500 text-indigo-400">คลังของฉัน (My Vault)</button>
            <button id="tabSharedWithMe" class="font-medium text-lg pb-1 border-b-2 border-transparent text-slate-400 hover:text-slate-200">แชร์มาให้ฉัน</button>
          </div>
          <span id="itemCount" class="text-xs text-slate-400">กำลังโหลดข้อมูล...</span>
        </div>

        <!-- Gallery Grid -->
        <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
          <!-- Injected via JS -->
        </div>
      </section>

    </div>
  </main>

  <!-- Modal สำหรับแชร์สื่อ -->
  <div id="shareModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-4">
      <h3 class="text-lg font-bold">แชร์รูปภาพ/วิดีโอนี้</h3>
      <p class="text-xs text-slate-400">กรอกอีเมลของเพื่อนที่ต้องการแชร์ให้ดู (เพื่อนจะเห็นรูปนี้ในแท็บ "แชร์มาให้ฉัน")</p>
      <input id="shareTargetEmail" type="email" placeholder="friend@example.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
      <div class="flex justify-end gap-2 pt-2">
        <button id="btnCloseShareModal" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs">ยกเลิก</button>
        <button id="btnConfirmShare" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold">ยืนยันการแชร์</button>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      query, 
      where, 
      orderBy, 
      onSnapshot, 
      doc, 
      updateDoc, 
      arrayUnion, 
      deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getStorage, 
      ref, 
      uploadBytes, 
      getDownloadURL, 
      deleteObject 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // --- Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyB2MxyQRN-wCWvS-xxmvpAygU-6jstnzxY",
      authDomain: "cumming-674ca.firebaseapp.com",
      databaseURL: "https://cumming-674ca-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cumming-674ca",
      storageBucket: "cumming-674ca.firebasestorage.app",
      messagingSenderId: "612384158913",
      appId: "1:612384158913:web:c55aa85841ee7aadcc5040",
      measurementId: "G-3VQ6XSVYBE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // State Variables
    let currentUser = null;
    let currentStream = null;
    let facingMode = "user";
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordInterval = null;
    let recordSeconds = 0;
    let currentTab = "myVault";
    let targetShareDocId = null;
    let unsubscribeGallery = null;

    // DOM Elements
    const authSection = document.getElementById("authSection");
    const loginPrompt = document.getElementById("loginPrompt");
    const studioApp = document.getElementById("studioApp");
    const videoPreview = document.getElementById("videoPreview");
    const captureCanvas = document.getElementById("captureCanvas");
    const filterSelect = document.getElementById("filterSelect");
    const timerSelect = document.getElementById("timerSelect");
    const btnFlipCamera = document.getElementById("btnFlipCamera");
    const btnCapturePhoto = document.getElementById("btnCapturePhoto");
    const btnToggleRecord = document.getElementById("btnToggleRecord");
    const recordBtnLabel = document.getElementById("recordBtnLabel");
    const recordingBadge = document.getElementById("recordingBadge");
    const recordingTimer = document.getElementById("recordingTimer");
    const countdownBox = document.getElementById("countdownBox");
    const countdownNumber = document.getElementById("countdownNumber");
    const galleryGrid = document.getElementById("galleryGrid");
    const itemCount = document.getElementById("itemCount");
    const tabMyVault = document.getElementById("tabMyVault");
    const tabSharedWithMe = document.getElementById("tabSharedWithMe");
    const shareModal = document.getElementById("shareModal");
    const shareTargetEmail = document.getElementById("shareTargetEmail");

    // --- Authentication ---
    document.getElementById("btnLogin").addEventListener("click", async () => {
      const email = document.getElementById("authEmail").value.trim();
      const pass = document.getElementById("authPassword").value;
      if (!email || !pass) return alert("กรุณากรอกอีเมลและรหัสผ่าน");
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        alert("เข้าสู่ระบบไม่สำเร็จ: " + err.message);
      }
    });

    document.getElementById("btnRegister").addEventListener("click", async () => {
      const email = document.getElementById("authEmail").value.trim();
      const pass = document.getElementById("authPassword").value;
      if (!email || !pass) return alert("กรุณากรอกอีเมลและรหัสผ่าน");
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        alert("สมัครสมาชิกสำเร็จ!");
      } catch (err) {
        alert("สมัครไม่สำเร็จ: " + err.message);
      }
    });

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        loginPrompt.classList.add("hidden");
        studioApp.classList.remove("hidden");
        authSection.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-xs text-slate-400 hidden sm:inline"><i class="fa-regular fa-user text-indigo-400"></i> ${user.email}</span>
            <button id="btnLogout" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs transition border border-slate-700">ออกจากระบบ</button>
          </div>
        `;
        document.getElementById("btnLogout").addEventListener("click", () => signOut(auth));
        startCamera();
        listenToGallery();
      } else {
        loginPrompt.classList.remove("hidden");
        studioApp.classList.add("hidden");
        authSection.innerHTML = ``;
        stopCamera();
        if (unsubscribeGallery) unsubscribeGallery();
      }
    });

    // --- Camera & Recording Controls ---
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        videoPreview.srcObject = currentStream;
      } catch (err) {
        console.error("Camera access error:", err);
        alert("ไม่สามารถเข้าถึงกล้องหรือไมโครโฟนได้ กรุณาอนุญาตสิทธิ์การใช้งาน");
      }
    }

    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
    }

    btnFlipCamera.addEventListener("click", () => {
      facingMode = (facingMode === "user") ? "environment" : "user";
      startCamera();
    });

    filterSelect.addEventListener("change", (e) => {
      videoPreview.className = `w-full h-full object-cover transition duration-200 filter-${e.target.value}`;
    });

    // Countdown Helper
    function runTimer(seconds) {
      return new Promise((resolve) => {
        if (seconds <= 0) return resolve();
        countdownBox.classList.remove("hidden");
        let count = seconds;
        countdownNumber.textContent = count;
        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            countdownNumber.textContent = count;
          } else {
            clearInterval(timer);
            countdownBox.classList.add("hidden");
            resolve();
          }
        }, 1000);
      });
    }

    // Capture Photo
    btnCapturePhoto.addEventListener("click", async () => {
      const waitTime = parseInt(timerSelect.value);
      await runTimer(waitTime);

      captureCanvas.width = videoPreview.videoWidth;
      captureCanvas.height = videoPreview.videoHeight;
      const ctx = captureCanvas.getContext("2d");
      
      // Filter Apply
      ctx.filter = getComputedStyle(videoPreview).filter;
      ctx.drawImage(videoPreview, 0, 0, captureCanvas.width, captureCanvas.height);

      captureCanvas.toBlob(async (blob) => {
        await saveMediaToCloud(blob, "image");
      }, "image/jpeg", 0.92);
    });

    // Video Recording
    btnToggleRecord.addEventListener("click", async () => {
      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        const waitTime = parseInt(timerSelect.value);
        await runTimer(waitTime);
        startRecording();
      } else {
        stopRecording();
      }
    });

    function startRecording() {
      recordedChunks = [];
      const options = { mimeType: "video/webm;codecs=vp9,opus" };
      try {
        mediaRecorder = new MediaRecorder(currentStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(currentStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        const blob = new Blob(recordedChunks, { type: "video/webm" });
        await saveMediaToCloud(blob, "video");
      };

      mediaRecorder.start();
      recordSeconds = 0;
      recordingBadge.classList.remove("hidden");
      recordBtnLabel.textContent = "หยุดอัด";
      btnToggleRecord.classList.replace("bg-red-600", "bg-amber-600");
      
      recordInterval = setInterval(() => {
        recordSeconds++;
        const mins = String(Math.floor(recordSeconds / 60)).padStart(2, "0");
        const secs = String(recordSeconds % 60).padStart(2, "0");
        recordingTimer.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopRecording() {
      if (mediaRecorder) mediaRecorder.stop();
      clearInterval(recordInterval);
      recordingBadge.classList.add("hidden");
      recordBtnLabel.textContent = "อัดวิดีโอ";
      btnToggleRecord.classList.replace("bg-amber-600", "bg-red-600");
    }

    // --- Cloud Storage & Firestore Integration ---
    async function saveMediaToCloud(blob, type) {
      if (!currentUser) return;
      const originalText = type === "image" ? btnCapturePhoto.innerHTML : btnToggleRecord.innerHTML;
      if (type === "image") btnCapturePhoto.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> บันทึก...`;

      try {
        const filename = `${type}_${Date.now()}.${type === "image" ? "jpg" : "webm"}`;
        const storagePath = `users/${currentUser.uid}/${filename}`;
        const storageItemRef = ref(storage, storagePath);

        // Upload file to Firebase Storage
        const uploadResult = await uploadBytes(storageItemRef, blob);
        const downloadUrl = await getDownloadURL(uploadResult.ref);

        // Save metadata to Cloud Firestore
        await addDoc(collection(db, "media_vault"), {
          ownerId: currentUser.uid,
          ownerEmail: currentUser.email,
          type: type,
          url: downloadUrl,
          storagePath: storagePath,
          createdAt: Date.now(),
          sharedWith: []
        });

      } catch (err) {
        console.error("Save error:", err);
        alert("บันทึกลงระบบคลาวด์ไม่สำเร็จ: " + err.message);
      } finally {
        if (type === "image") btnCapturePhoto.innerHTML = originalText;
      }
    }

    // --- Real-time Vault Gallery (ดูคลังย้อนหลัง) ---
    function listenToGallery() {
      if (!currentUser) return;
      if (unsubscribeGallery) unsubscribeGallery();

      let q;
      if (currentTab === "myVault") {
        q = query(
          collection(db, "media_vault"),
          where("ownerId", "==", currentUser.uid),
          orderBy("createdAt", "desc")
        );
      } else {
        q = query(
          collection(db, "media_vault"),
          where("sharedWith", "array-contains", currentUser.email),
          orderBy("createdAt", "desc")
        );
      }

      unsubscribeGallery = onSnapshot(q, (snapshot) => {
        itemCount.textContent = `พบ ${snapshot.size} รายการ`;
        galleryGrid.innerHTML = "";

        if (snapshot.empty) {
          galleryGrid.innerHTML = `
            <div class="col-span-full py-12 text-center text-slate-500 border border-dashed border-slate-800 rounded-2xl">
              <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
              <p class="text-sm">ยังไม่มีรูปภาพหรือวิดีโอในคลังนี้</p>
            </div>
          `;
          return;
        }

        snapshot.forEach((docSnap) => {
          const item = docSnap.data();
          const docId = docSnap.id;
          const dateStr = new Date(item.createdAt).toLocaleString("th-TH");

          const card = document.createElement("div");
          card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg flex flex-col group";

          const mediaContainer = document.createElement("div");
          mediaContainer.className = "relative aspect-video bg-black flex items-center justify-center overflow-hidden";

          if (item.type === "image") {
            mediaContainer.innerHTML = `<img src="${item.url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">`;
          } else {
            mediaContainer.innerHTML = `<video src="${item.url}" controls class="w-full h-full object-cover"></video>`;
          }

          const details = document.createElement("div");
          details.className = "p-4 flex-1 flex flex-col justify-between gap-3";
          
          let ownerBadge = currentTab === "myVault" 
            ? `<span class="text-[11px] text-slate-400"><i class="fa-regular fa-clock"></i> ${dateStr}</span>`
            : `<span class="text-[11px] text-indigo-400"><i class="fa-solid fa-share-nodes"></i> แชร์โดย: ${item.ownerEmail}</span>`;

          details.innerHTML = `
            <div>
              <div class="flex items-center justify-between">
                <span class="text-xs uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">${item.type}</span>
                ${ownerBadge}
              </div>
            </div>

            <div class="flex items-center gap-2 pt-2 border-t border-slate-800">
              <a href="${item.url}" download target="_blank" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 px-3 rounded-lg text-xs font-medium flex items-center justify-center gap-1.5 transition">
                <i class="fa-solid fa-download"></i> เซฟลงเครื่อง
              </a>
              ${currentTab === "myVault" ? `
                <button data-action="share" data-id="${docId}" class="p-2 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 rounded-lg text-xs transition" title="แชร์ให้เพื่อน">
                  <i class="fa-solid fa-share-nodes"></i>
                </button>
                <button data-action="delete" data-id="${docId}" data-path="${item.storagePath}" class="p-2 bg-red-600/20 hover:bg-red-600/30 text-red-400 rounded-lg text-xs transition" title="ลบ">
                  <i class="fa-solid fa-trash"></i>
                </button>
              ` : ''}
            </div>
          `;

          card.appendChild(mediaContainer);
          card.appendChild(details);
          galleryGrid.appendChild(card);
        });
      }, (err) => {
        console.error("Gallery query error:", err);
      });
    }

    // Tabs Switcher
    tabMyVault.addEventListener("click", () => {
      currentTab = "myVault";
      tabMyVault.className = "font-semibold text-lg pb-1 border-b-2 border-indigo-500 text-indigo-400";
      tabSharedWithMe.className = "font-medium text-lg pb-1 border-b-2 border-transparent text-slate-400 hover:text-slate-200";
      listenToGallery();
    });

    tabSharedWithMe.addEventListener("click", () => {
      currentTab = "sharedWithMe";
      tabSharedWithMe.className = "font-semibold text-lg pb-1 border-b-2 border-indigo-500 text-indigo-400";
      tabMyVault.className = "font-medium text-lg pb-1 border-b-2 border-transparent text-slate-400 hover:text-slate-200";
      listenToGallery();
    });

    // Gallery Actions (Delete / Share)
    galleryGrid.addEventListener("click", async (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const action = btn.dataset.action;
      const id = btn.dataset.id;

      if (action === "delete") {
        if (!confirm("คุณแน่ใจว่าต้องการลบรายการนี้ออกจากคลัง?")) return;
        const path = btn.dataset.path;
        try {
          await deleteDoc(doc(db, "media_vault", id));
          if (path) await deleteObject(ref(storage, path));
        } catch (err) {
          alert("ไม่สามารถลบได้: " + err.message);
        }
      }

      if (action === "share") {
        targetShareDocId = id;
        shareModal.classList.remove("hidden");
      }
    });

    // Share Modal Actions
    document.getElementById("btnCloseShareModal").addEventListener("click", () => {
      shareModal.classList.add("hidden");
      shareTargetEmail.value = "";
    });

    document.getElementById("btnConfirmShare").addEventListener("click", async () => {
      const email = shareTargetEmail.value.trim().toLowerCase();
      if (!email) return alert("กรุณาระบุอีเมลผู้รับ");
      if (email === currentUser.email.toLowerCase()) return alert("ไม่สามารถแชร์ให้อีเมลตัวเองได้");

      try {
        await updateDoc(doc(db, "media_vault", targetShareDocId), {
          sharedWith: arrayUnion(email)
        });
        alert(`แชร์ให้ ${email} เรียบร้อยแล้ว!`);
        shareModal.classList.add("hidden");
        shareTargetEmail.value = "";
      } catch (err) {
        alert("แชร์ไม่สำเร็จ: " + err.message);
      }
    });
  </script>
</body>
</html>
